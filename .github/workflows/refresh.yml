name: Refresh tracker auto-state

# Nightly freshness loop. Reads upstream issue/PR/discussion state for every tracking_issue,
# sweeps for payjoin activity outside the org (GitHub issues/PRs/commits/repos, plus press,
# forums and newsletters), and commits the data files to master, which Cloudflare Pages
# rebuilds.
#
# Something substantial just happened and you don't want to wait for the cron? Trigger it by
# hand — Actions tab -> "Refresh tracker auto-state" -> "Run workflow", or:
#     gh workflow run refresh.yml -R payjoin/integrations-tracker
# Re-running is safe: rows are merged by URL, so a mid-day run refreshes facts rather than
# adding duplicates.
on:
  schedule:
    # 00:17 UTC = ~08:17 Asia/Taipei (UTC+8, no DST). :17 dodges the contended top-of-hour
    # tick where GitHub delays/drops scheduled jobs. Treat arrival as approximate.
    - cron: '17 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      # Fail loudly on run 1 if the credential is missing/expired/mis-scoped, BEFORE the sweep.
      - name: Credential probe
        env:
          GH_TOKEN: ${{ secrets.PAYJOIN_TRACKER_PAT }}
        run: python scripts/refresh.py --probe

      - name: Refresh auto-state
        env:
          GH_TOKEN: ${{ secrets.PAYJOIN_TRACKER_PAT }}
        run: python scripts/refresh.py

      # Direct-commit machine-verifiable facts + the digest to master (no PR chore). The digest
      # carries the UTC date, so it changes ~daily (heartbeat + keeps the cron from auto-disabling);
      # same-day reruns with no upstream change are idempotent -> no commit. CF Pages rebuilds on push.
      - name: Commit if changed
        run: |
          git add data/auto-state.yaml docs/digest.md data/candidates.yaml data/news.yaml
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh tracker auto-state + digest"
          git push origin HEAD:master || {
            git pull --rebase origin master && git push origin HEAD:master
          }
