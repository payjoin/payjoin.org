# The unlock graph: what has to ship, in what order, to get from today's artifacts to
# 50,000 payjoins a week. One record per node. Human-owned; machine facts (last activity,
# evidence state, days idle) live in data/unlocks-auto.yaml, written nightly.
#
# Fields
#   id          stable slug, referenced by blocks/blocked_by
#   title       what the node is
#   kind        artifact | spec | binding | corridor | cohort | integration
#   wave        0..4, the build order
#   public      true -> rendered on the public site; false -> never leaves this repo
#   owner       GitHub handle, or "" when nobody has claimed it
#   blocked_by  ids that must finish before this one can
#   blocks      ids this one holds up (declare an edge on either side; both is fine)
#   evidence    URLs the nightly refresh stamps (GitHub issues, PRs, repos get live state)
#   status      done | active | idle | not-started
#   note        one line, human-owned
#
# Public rule: nodes about our own artifacts (releases, bindings, test vectors, spec PRs,
# BIP status) are public, as are integrations already listed on the public Integrations
# page. Anything naming a company that is not already public there, and anything that
# reads as a pitch, stays private. When in doubt, private.
#
# Validate with: python scripts/unlocks.py check   (the site build runs the same check)

