# River - Exchange
- name: River
  class: exchange_custodian
  status: prospect
  language: Elixir
  custody: custodial
  scores:
    leverage: 5
    feasibility: 1
    maintenance: 5
  spec_feedback: real_usage
  blocker: BB case study to convert willingness; integration path scoped (sidecar primary, uniffi-elixir long-term)
  notes: >-
    Huge Bitcoin-only exchange. Alex Lieshman. Elixir backend. BEAM has no
    dlopen-style FFI — only NIFs or Ports — so the two real paths are
    (1) sidecar Rust service Elixir calls via HTTP/webhooks, or
    (2) a uniffi-elixir target that emits Rustler-style NIF glue (real
    project, would also serve any future BEAM Bitcoin integrations).
    Async-by-default v2 fits BEAM well: stateless sidecar doing pure
    crypto/state-machine transitions while Elixir owns the long-poll and
    session persistence, or invert it and have the sidecar long-poll the
    directory and webhook River. Lead with sidecar pitch after the BB case
    study lands; uniffi-elixir (or hand-rolled Rustler against just the
    receiver subset they use) is a post-deal workstream if their team
    prefers in-VM. Pre-pitch check — does River already run any Rust
    services adjacent to their Elixir core? If yes, sidecar reads as
    "another one of those."
  contact:
    name: Alex Lieshman
  owner:
    name: Dan Gould
    internal: true

